name: Mantine nonadjacent row errors native verification
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-mantine-reorder-errors]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mantinedev/mantine
          ref: aa34f59c9af82948d0ad6a012671bf974255715b
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.3.0'
      - name: Freeze pinned whole-source baseline and identical diagnostic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ASSETS'
          import base64,json,os,pathlib,zlib
          packet=pathlib.Path(os.environ['RUNNER_TEMP'])/'mantine-after'
          packet.mkdir()
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,value in assets.items():
              target=packet/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(value)
          print('MANTINE_AFTER_WORKFLOW_COMMIT '+os.environ['GITHUB_SHA'])
          ASSETS
          python3 "$RUNNER_TEMP/mantine-after/guard.py" capture
      - name: Install immutable upstream dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
          python3 "$RUNNER_TEMP/mantine-after/guard.py" before-after-install
      - name: Require the same fourteen-case red baseline
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          set +e
          npm run jest -- --runInBand --verbose --runTestsByPath packages/@mantine/form/src/tests/use-form/reorder-record-errors.test.tsx --json --outputFile="$packet/frozen-before.json" > "$packet/frozen-before.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$packet/frozen-before.status"
          cat "$packet/frozen-before.log"
          printf 'MANTINE_RAW_JSON_BEGIN frozen-before\n'
          cat "$packet/frozen-before.json"
          printf '\nMANTINE_RAW_JSON_END frozen-before\n'

          python3 "$packet/guard.py" before-after-native
          python3 "$packet/assess.py" frozen-before
      - name: Apply only the declared three-file source patch
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          git apply --check "$packet/change.patch"
          git apply "$packet/change.patch"
          python3 "$packet/guard.py" patched
      - name: Prove permanent regressions fail without the production correction
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          implementation=packages/@mantine/form/src/lists/reorder-errors.ts
          git show "HEAD:$implementation" > "$implementation"
          python3 "$packet/guard.py" regression-red

          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          set +e
          npm run jest -- --runInBand --verbose --runTestsByPath packages/@mantine/form/src/lists/reorder-errors.test.ts packages/@mantine/form/src/tests/use-form/reorderListItem.test.ts --json --outputFile="$packet/permanent-red.json" > "$packet/permanent-red.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$packet/permanent-red.status"
          cat "$packet/permanent-red.log"
          printf 'MANTINE_RAW_JSON_BEGIN permanent-red\n'
          cat "$packet/permanent-red.json"
          printf '\nMANTINE_RAW_JSON_END permanent-red\n'

          python3 "$packet/guard.py" regression-red
          cp "$packet/source-files/packages/@mantine/form/src/lists/reorder-errors.ts" packages/@mantine/form/src/lists/reorder-errors.ts
          python3 "$packet/guard.py" patched
          python3 "$packet/assess.py" permanent-red
      - name: Require all fourteen unchanged public-hook cases green
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          set +e
          npm run jest -- --runInBand --verbose --runTestsByPath packages/@mantine/form/src/tests/use-form/reorder-record-errors.test.tsx --json --outputFile="$packet/frozen-after.json" > "$packet/frozen-after.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$packet/frozen-after.status"
          cat "$packet/frozen-after.log"
          printf 'MANTINE_RAW_JSON_BEGIN frozen-after\n'
          cat "$packet/frozen-after.json"
          printf '\nMANTINE_RAW_JSON_END frozen-after\n'

          python3 "$packet/guard.py" after-frozen
          python3 "$packet/assess.py" frozen-after
      - name: Retire the unchanged diagnostic fixture before repository-wide format checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mantine-after/guard.py" retire-fixture
      - name: Require changed permanent helper and public-hook suites green
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          set +e
          npm run jest -- --runInBand --verbose --runTestsByPath packages/@mantine/form/src/lists/reorder-errors.test.ts packages/@mantine/form/src/tests/use-form/reorderListItem.test.ts --json --outputFile="$packet/permanent-after.json" > "$packet/permanent-after.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$packet/permanent-after.status"
          cat "$packet/permanent-after.log"
          printf 'MANTINE_RAW_JSON_BEGIN permanent-after\n'
          cat "$packet/permanent-after.json"
          printf '\nMANTINE_RAW_JSON_END permanent-after\n'

          python3 "$packet/guard.py" after-permanent
          python3 "$packet/assess.py" permanent-after
      - name: Require the complete form package suite green
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/mantine-after"
          set +e
          npm run jest -- --runInBand --verbose @mantine/form --json --outputFile="$packet/full-form.json" > "$packet/full-form.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$packet/full-form.status"
          cat "$packet/full-form.log"
          printf 'MANTINE_RAW_JSON_BEGIN full-form\n'
          cat "$packet/full-form.json"
          printf '\nMANTINE_RAW_JSON_END full-form\n'

          python3 "$packet/guard.py" after-full-form
          python3 "$packet/assess.py" full-form
      - name: Run mandatory lint and formatter on every changed file
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install oxlint -c oxlint.config.mjs packages/@mantine/form/src/lists/reorder-errors.test.ts packages/@mantine/form/src/lists/reorder-errors.ts packages/@mantine/form/src/tests/use-form/reorderListItem.test.ts
          npm run format:write:files -- packages/@mantine/form/src/lists/reorder-errors.test.ts packages/@mantine/form/src/lists/reorder-errors.ts packages/@mantine/form/src/tests/use-form/reorderListItem.test.ts
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-format-lint
      - name: Run documented project setup
        shell: bash
        run: |
          set -euo pipefail
          npm run setup
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-setup
      - name: Run mandatory full build
        shell: bash
        run: |
          set -euo pipefail
          npm run build all
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-build
      - name: Validate official ESM entry points
        shell: bash
        run: |
          set -euo pipefail
          npm run test:esm-entrypoints
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-esm
      - name: Compile documentation data required by upstream PR workflow
        shell: bash
        run: |
          set -euo pipefail
          npm run compile:llm && npm run compile:mcp
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-docs-data
      - name: Run full upstream npm test including typecheck lint and format gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python3 "$RUNNER_TEMP/mantine-after/guard.py" after-npm-test
      - name: Record Codex CLI review availability and enforce follow-through
        shell: bash
        run: |
          set -euo pipefail
          if command -v codex; then
            printf 'MANTINE_CODEX_REVIEW_AVAILABLE_PENDING: upstream requires /codex-code-review; root must run it and apply findings before publication.
          '
            exit 2
          else
            printf 'MANTINE_CODEX_REVIEW_UNAVAILABLE: command -v codex found no installed CLI; no review was claimed or tool installed.
          '
          fi
          python3 "$RUNNER_TEMP/mantine-after/guard.py" final
      - name: Always report final tracked source index and tree state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mantine-after/guard.py" final
      - name: Preserve changed canonical source text if formatter or setup altered it
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCANON'
          import os,pathlib,json,hashlib
          packet=pathlib.Path(os.environ['RUNNER_TEMP'])/'mantine-after'
          m=json.loads((packet/'manifest.json').read_text())
          for f in m['files']:
              p=pathlib.Path(f['path'])
              if p.is_file():
                  b=p.read_bytes();h=hashlib.sha256(b).hexdigest()
                  if h!=f['after_sha256']:
                      print('MANTINE_CHANGED_CANONICAL_SOURCE '+json.dumps({'path':f['path'],'sha256':h,'text':b.decode()}),flush=True)
          PYCANON
