name: Mantine finite public-hook before
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-reorder-errors]
permissions:
  contents: read
jobs:
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mantinedev/mantine
          ref: aa34f59c9af82948d0ad6a012671bf974255715b
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.3.0'
      - name: Freeze immutable fixture and all tracked upstream source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import os,pathlib,base64,zlib,json
          a=pathlib.Path(os.environ['RUNNER_TEMP'])/'mantine-before';a.mkdir()
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,value in assets.items():(a/name).write_text(value)
          print('MANTINE_WORKFLOW_COMMIT '+os.environ['GITHUB_SHA'])
          PYASSETS
          python3 "$RUNNER_TEMP/mantine-before/guard.py" capture
      - name: Install unchanged upstream dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=@yarnpkg/cli-dist@4.18.1 -- yarn install --immutable
          python3 "$RUNNER_TEMP/mantine-before/guard.py" after-install
      - name: Capture actual fourteen-case native output before assessment
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run jest -- --runInBand --runTestsByPath packages/@mantine/form/src/tests/use-form/reorder-record-errors.test.tsx --json --outputFile="$RUNNER_TEMP/mantine-before/result.json" > "$RUNNER_TEMP/mantine-before/test.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/mantine-before/status"
          cat "$RUNNER_TEMP/mantine-before/test.log"
          echo MANTINE_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/mantine-before/result.json"
          echo
          echo MANTINE_RAW_JSON_END
          python3 "$RUNNER_TEMP/mantine-before/guard.py" after-native
      - name: Require finite attempted cases and genuine passing controls
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mantine-before/assess.py"
          python3 "$RUNNER_TEMP/mantine-before/guard.py" final
